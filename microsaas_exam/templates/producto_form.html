{% extends 'base.html' %}
{% block content %}
  <h1 class="title">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h1>
  <div class="card">
    <form method="POST">
      <input type="text" name="nombre" placeholder="Nombre" value="{{ producto[1] if producto else '' }}" required>
      <input type="number" step="0.01" name="precio" placeholder="Precio" value="{{ producto[2] if producto else '' }}" required>
      <button type="submit">Guardar</button>
    </form>
  </div>
{% endblock %}
