{% extends 'base.html' %}
{% block content %}
  <h1 class="title">Productos</h1>
  <p><a href="{{ url_for('producto_add') }}" class="btn">➕ Nuevo producto</a></p>
  <table>
    <tr><th>ID</th><th>Nombre</th><th>Precio (€)</th><th>Acciones</th></tr>
    {% for p in productos %}
    <tr>
      <td>{{ p[0] }}</td>
      <td>{{ p[1] }}</td>
      <td>{{ '%.2f'|format(p[2]) }}</td>
      <td class="actions">
        <a href="{{ url_for('producto_edit', id=p[0]) }}">Editar</a>
        <a href="{{ url_for('producto_delete', id=p[0]) }}">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
